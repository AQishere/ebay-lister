[project]
name = "ebay-lister"
version = "0.1.0"
requires-python = ">=3.11"
# Keep in sync with requirements.txt (Vercel may read either).
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pymongo>=4.10",
    "pydantic-settings>=2.4",
    "numpy>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
